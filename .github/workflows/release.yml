name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packed tarball to npm.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: inputs.publish
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Require matching version tag
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm publish --access public --provenance
